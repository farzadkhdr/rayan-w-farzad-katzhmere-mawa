<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ڕەیان و فەرزاد | کاتژمێری مانەوە</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(ellipse at center, #0b0c1e 0%, #030514 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    .container {
      position: relative;
      z-index: 10;
      backdrop-filter: blur(16px);
      background: rgba(10, 15, 35, 0.55);
      border-radius: 48px;
      padding: 30px 25px 25px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 700px;
      width: 100%;
      border: 1px solid rgba(255, 215, 0, 0.25);
    }

    h1 {
      color: #fbe9b1;
      font-size: 2.6rem;
      font-weight: 600;
      text-shadow: 0 0 25px #ffb703, 0 0 8px #fb8500;
      letter-spacing: 3px;
      margin-bottom: 15px;
      text-align: center;
    }

    .title-sub {
      color: #f5d742;
      font-size: 1.9rem;
      font-weight: 400;
      margin-bottom: 25px;
      text-shadow: 0 0 18px #faa307;
    }

    .countdown-panel {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      border-radius: 80px;
      padding: 20px 25px;
      margin: 5px 0 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 18px;
      border: 1px solid #ffd966;
      box-shadow: 0 10px 30px rgba(255, 200, 0, 0.3);
    }

    .time-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 70px;
    }

    .time-number {
      font-size: 3rem;
      font-weight: 700;
      color: #fff7e6;
      text-shadow: 0 0 20px #ffaa00, 0 0 8px #ff7b00;
      line-height: 1;
    }

    .time-label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fedb9f;
      margin-top: 5px;
    }

    .small-seconds {
      display: flex;
      align-items: baseline;
      gap: 5px;
      margin-left: 5px;
    }

    .seconds-number {
      font-size: 2.4rem;
      font-weight: 600;
      color: #ffd966;
      text-shadow: 0 0 18px #f39c12;
    }

    .music-btn {
      background: linear-gradient(135deg, #ffb703, #fb8500);
      border: none;
      color: #0a0a1a;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 12px 28px;
      border-radius: 40px;
      margin: 15px 0 10px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 170, 0, 0.5);
      transition: all 0.3s ease;
      letter-spacing: 1px;
      font-family: 'Segoe UI', 'Arial', sans-serif;
    }

    .music-btn:hover {
      background: linear-gradient(135deg, #ffa500, #ff6d00);
      box-shadow: 0 0 40px rgba(255, 140, 0, 0.8);
      transform: scale(1.05);
    }

    .music-btn.playing {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      box-shadow: 0 0 30px rgba(46, 204, 113, 0.6);
    }

    .footer-img {
      margin-top: 15px;
      width: 100%;
      display: flex;
      justify-content: center;
      border-radius: 30px;
      overflow: hidden;
      background: rgba(20, 20, 40, 0.5);
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      border: 1px solid rgba(255, 215, 0, 0.4);
    }

    .footer-img img {
      width: 100%;
      height: auto;
      max-height: 180px;
      object-fit: contain;
      display: block;
      background: #0a0a14;
      border-radius: 24px;
    }

    /* هەسارەکان */
    .planet {
      position: absolute;
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }

    .planet-1 {
      width: 110px;
      height: 110px;
      top: 8%;
      left: 5%;
      background: radial-gradient(circle at 35% 35%, #c97e4b, #6b3e1e);
      box-shadow: 0 0 60px #d97823;
    }

    .planet-2 {
      width: 75px;
      height: 75px;
      bottom: 12%;
      right: 4%;
      background: radial-gradient(circle at 40% 40%, #b0a48b, #5d5340);
      box-shadow: 0 0 45px #c4ad7c;
    }

    .planet-3 {
      width: 140px;
      height: 140px;
      top: 15%;
      right: 7%;
      background: radial-gradient(circle at 30% 30%, #2b6f9c, #0b3b5e);
      box-shadow: 0 0 70px #3b8ec2;
    }

    .planet-4 {
      width: 50px;
      height: 50px;
      bottom: 18%;
      left: 12%;
      background: radial-gradient(circle at 40% 40%, #d6b17e, #7a5a3a);
      box-shadow: 0 0 35px #daa06a;
    }

    @media (max-width: 550px) {
      .time-number {
        font-size: 2.2rem;
      }
      .container {
        padding: 20px 15px;
      }
    }
  </style>
</head>
<body>

  <!-- ئەستێرەکان -->
  <canvas id="stars-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;"></canvas>

  <!-- هەسارەکان -->
  <div class="planet planet-1"></div>
  <div class="planet planet-2"></div>
  <div class="planet planet-3"></div>
  <div class="planet planet-4"></div>

  <div class="container">
    <h1>ڕەیان فەرزاد</h1>
    <div class="title-sub">✨ تا 12/12/2026 ✨</div>

    <div class="countdown-panel" id="countdown">
      <div class="time-block">
        <span class="time-number" id="days">00</span>
        <span class="time-label">ڕۆژ</span>
      </div>
      <div class="time-block">
        <span class="time-number" id="hours">00</span>
        <span class="time-label">سەعات</span>
      </div>
      <div class="time-block">
        <span class="time-number" id="minutes">00</span>
        <span class="time-label">دەقە</span>
      </div>
      <div class="time-block small-seconds">
        <span class="seconds-number" id="seconds">00</span>
        <span class="time-label" style="margin-left:2px;">چرکە</span>
      </div>
    </div>

    <!-- دوگمەی موزیک -->
    <button class="music-btn" id="music-toggle" onclick="toggleMusic()">🔊 پەخشی موزیک</button>

    <div class="footer-img">
      <img src="https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_8805.png" 
           alt="Rayan Farzad image" 
           crossorigin="anonymous"
           onerror="this.style.display='none';">
    </div>
  </div>

  <!-- Audio element بۆ موزیک -->
  <audio id="bg-music" loop preload="auto" style="display:none;">
    <source src="https://docs.google.com/uc?export=download&id=1X3ZQ8KqYkht7Y6GnNwHjLs2F9RmVbPcW" type="audio/mpeg">
  </audio>

  <script>
    // ========== ئەستێرەکانی پاشبنەما ==========
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2.2 + 0.6,
        opacity: Math.random(),
        speed: Math.random() * 0.02 + 0.005,
        direction: Math.random() < 0.5 ? 1 : -1
      });
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.opacity += star.speed * star.direction;
        if (star.opacity >= 0.9 || star.opacity <= 0.15) {
          star.direction *= -1;
        }
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 250, 210, ${star.opacity})`;
        ctx.fill();
        ctx.shadowColor = '#fff9c4';
        ctx.shadowBlur = star.radius * 4;
      });
      requestAnimationFrame(drawStars);
    }
    drawStars();

    // ========== کاتژمێری مانەوە ==========
    const targetDate = new Date(2026, 11, 12, 0, 0, 0); // 12/12/2026
    
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    function calculateRemaining() {
      const now = new Date();
      let diffMs = targetDate - now;

      if (diffMs <= 0) {
        daysEl.textContent = '00';
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        return;
      }

      const totalSeconds = Math.floor(diffMs / 1000);
      const days = Math.floor(totalSeconds / (60 * 60 * 24));
      const hours = Math.floor((totalSeconds % (60 * 60 * 24)) / (60 * 60));
      const minutes = Math.floor((totalSeconds % (60 * 60)) / 60);
      const seconds = totalSeconds % 60;

      daysEl.textContent = days < 10 ? '0' + days : days;
      hoursEl.textContent = hours < 10 ? '0' + hours : hours;
      minutesEl.textContent = minutes < 10 ? '0' + minutes : minutes;
      secondsEl.textContent = seconds < 10 ? '0' + seconds : seconds;
    }

    calculateRemaining();
    const timerInterval = setInterval(calculateRemaining, 1000);

    // ========== موزیک ==========
    const audio = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-toggle');
    let musicPlaying = false;

    // YouTube audio stream (ڕاستەوخۆ)
    // بەکارهێنانی YouTube audio downloader proxy
    const youtubeAudioUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://www.youtube.com/watch?v=9AXyX555ZoU');
    
    // بەڵام بۆ ئەوەی ڕاستەوخۆ کار بکات، ئێمە لینکی ڕاستەوخۆی ئەو دەنگە بەکاردەهێنین
    // کە لە YouTube Audio Library وەرگیراوە یان لینکی پرۆکسی
    // باشترین ڕێگا: بەکارهێنانی لینکی ڕاستەوخۆ
    const directAudioUrl = 'https://github.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/raw/main/audio/background.mp3';
    
    // ئەگەر فایلی دەنگ لە گیتهاب دانرابێت
    function setAudioSource() {
      // هەوڵدانی بارکردنی فایلی دەنگ لە گیتهاب (ئەگەر هەبێت)
      audio.src = directAudioUrl;
      audio.load();
      
      // ئەگەر سەرچاوەکە کار نەکات، لینکی پاشەکەوت بەکاربهێنە
      audio.addEventListener('error', function() {
        // بەکارهێنانی پرۆکسی بۆ YouTube
        audio.src = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://www.youtube.com/watch?v=9AXyX555ZoU');
        audio.load();
      });
    }

    setAudioSource();

    function toggleMusic() {
      if (musicPlaying) {
        audio.pause();
        musicBtn.textContent = '🔇 پەخشی موزیک';
        musicBtn.classList.remove('playing');
        musicPlaying = false;
      } else {
        // Play music
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            musicBtn.textContent = '🎵 موزیک بڕە';
            musicBtn.classList.add('playing');
            musicPlaying = true;
          }).catch(error => {
            console.log('پەخش شکستی هێنا، تکایە دووبارە هەوڵبدە');
            // هەوڵدانەوە بە دەستی بەکارهێنەر
            audio.play().then(() => {
              musicBtn.textContent = '🎵 موزیک بڕە';
              musicBtn.classList.add('playing');
              musicPlaying = true;
            }).catch(e => {
              alert('بۆ پەخشی موزیک، تکایە یەکەم جار کرتە لەسەر دوگمەکە بکە!');
            });
          });
        }
      }
    }

    // هەوڵدانی پەخشی خۆکار (بەڵام وێبگەڕەکان ڕێگری دەکەن)
    window.addEventListener('load', function() {
      // هەوڵدانی پەخشی خۆکار - زۆربەی وێبگەڕەکان ڕێگە نادەن
      const autoPlayPromise = audio.play();
      if (autoPlayPromise !== undefined) {
        autoPlayPromise.then(() => {
          musicBtn.textContent = '🎵 موزیک بڕە';
          musicBtn.classList.add('playing');
          musicPlaying = true;
        }).catch(() => {
          // خۆکار پەخش نەبوو، چاوەڕێی کرتەی بەکارهێنەر
          musicBtn.textContent = '🔊 پەخشی موزیک';
          musicPlaying = false;
        });
      }
    });

    // پاکردنەوە
    window.addEventListener('beforeunload', function() {
      clearInterval(timerInterval);
      audio.pause();
    });

  </script>
</body>
</html>
