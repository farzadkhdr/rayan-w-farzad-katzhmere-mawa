<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کاتژمێری ماوە</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    /* Background Video Container */
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    /* Main Container */
    .container {
      text-align: center;
      background: rgba(0, 0, 0, 0.65);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      max-width: 90%;
      width: 450px;
      cursor: pointer;
    }

    /* Planet Image Styling */
    .planet-container {
      width: 180px;
      height: 180px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
      border: 3px solid rgba(255, 255, 255, 0.8);
    }

    .planet-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      transition: opacity 0.1s ease-in-out;
    }

    /* Countdown Display */
    .countdown-title {
      font-size: 1.2rem;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    .timer {
      display: flex;
      justify-content: space-around;
      gap: 10px;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.15);
      padding: 10px;
      border-radius: 10px;
      flex: 1;
    }

    .time-box span {
      display: block;
    }

    .number {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .label {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-top: 5px;
    }

    .click-notice {
      font-size: 0.8rem;
      margin-top: 15px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <video class="video-bg" autoplay loop muted playsinline>
    <source src="https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/From%20Klickpin.com-%20Simple%20public%20policy%20thoughts%20for%20people%20who%20love%20beauty%20for%20busy%20days%20that%20keep%20things%20grounded-pin-id-761108405824554742.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <audio id="bg-audio" loop preload="auto">
    <source src="https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/vidssave.com%20INTERSTELLAR%20%E2%80%93%20Hans%20Zimmer%20-%204k%20720P%202.mp3" type="audio/mp3">
  </audio>

  <div class="container" id="main-card">
    <div class="planet-container">
      <img id="planet" class="planet-img" src="" alt="Planet View">
    </div>

    <div class="countdown-title">کاتی ماوە بۆ ۱۱ / ۱۱ / ۲۰۲۶</div>

    <div class="timer">
      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">ڕۆژ</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">کاتژمێر</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">خولەک</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">چرکە</span>
      </div>
    </div>

    <div class="click-notice" id="click-status">کلیک بکە بۆ لێدانی دەنگەکە 🔊</div>
  </div>

  <script>
    // Image Slider Configuration (Planet effect)
    const images = [
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_0009.jpeg",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_0359.jpeg",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_0482.jpeg",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_4338.png",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_4551.png",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_4648.jpeg",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_5253.jpeg",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_5254.jpeg",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_7613.jpeg"
    ];

    let currentImgIndex = 0;
    const planetImg = document.getElementById('planet');
    planetImg.src = images[0];

    // High speed image change (every 250ms)
    setInterval(() => {
      currentImgIndex = (currentImgIndex + 1) % images.length;
      planetImg.src = images[currentImgIndex];
    }, 250);

    // Audio Play Control on Click
    const audio = document.getElementById('bg-audio');
    const mainCard = document.getElementById('main-card');
    const clickStatus = document.getElementById('click-status');

    window.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          clickStatus.innerText = "دەنگەکە کارا بوو ♪";
        }).catch(err => console.log(err));
      }
    });

    // Countdown Logic (Target: 11/11/2026)
    const targetDate = new Date('November 11, 2026 00:00:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference > 0) {
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById('days').innerText = String(days).padStart(2, '0');
        document.getElementById('hours').innerText = String(hours).padStart(2, '0');
        document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
        document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
      } else {
        document.querySelector('.countdown-title').innerText = "کاتی دیاریکراو گەیشت!";
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
