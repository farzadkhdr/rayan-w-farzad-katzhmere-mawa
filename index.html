<!DOCTYPE html>
<html dir="rtl" lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕەیان و فەرزاد - کاژێری ماوە</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Naskh Arabic', 'Arial', sans-serif;
            background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a1e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 1.5s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .main-card {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(10px);
            padding: 25px 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #FFD700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 13px;
            color: #aaaaaa;
            margin-bottom: 25px;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 25px;
        }

        .countdown-box {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 12px 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .countdown-box .number {
            font-size: 32px;
            font-weight: 700;
            line-height: 1;
        }

        .countdown-box .label {
            font-size: 11px;
            color: #aaaaaa;
            margin-top: 4px;
        }

        .box-days .number { color: #4CAF50; }
        .box-hours .number { color: #2196F3; }
        .box-minutes .number { color: #FF9800; }
        .box-seconds .number { color: #F44336; }

        .november-box {
            font-size: 14px;
            color: #FF69B4;
            background: rgba(255, 105, 180, 0.08);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 105, 180, 0.2);
        }

        .planet-img {
            width: 120px;
            height: auto;
            border-radius: 10px;
            opacity: 0.85;
            box-shadow: 0 0 20px rgba(100, 100, 255, 0.2);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .music-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            z-index: 100;
            backdrop-filter: blur(5px);
            font-family: 'Noto Naskh Arabic', 'Arial', sans-serif;
            transition: all 0.3s;
        }

        .music-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .music-btn.playing {
            border-color: #4CAF50;
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.2);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.5s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-text {
            color: #FFD700;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-text">🎵 ئامادەکردنی موزیک...</div>
    </div>

    <!-- Stars -->
    <div class="stars" id="stars"></div>

    <!-- Music - using iframe trick for autoplay -->
    <iframe id="musicFrame" style="display:none" allow="autoplay"></iframe>
    <audio id="bgMusic" loop preload="auto" autoplay playsinline></audio>
    
    <button class="music-btn playing" id="musicBtn" onclick="toggleMusic()">🎵 موزیک ڕاهاتووە</button>

    <!-- Main card -->
    <div class="main-card">
        <h1 class="title">ڕەیان و فەرزاد</h1>
        <p class="subtitle">کاژێری ماوە بۆ 12/12/2026</p>

        <div class="countdown-grid">
            <div class="countdown-box box-days">
                <div class="number" id="days">0</div>
                <div class="label">ڕۆژ</div>
            </div>
            <div class="countdown-box box-hours">
                <div class="number" id="hours">0</div>
                <div class="label">کاتژمێر</div>
            </div>
            <div class="countdown-box box-minutes">
                <div class="number" id="minutes">0</div>
                <div class="label">خولەک</div>
            </div>
            <div class="countdown-box box-seconds">
                <div class="number" id="seconds">0</div>
                <div class="label">چرکە</div>
            </div>
        </div>

        <div class="november-box" id="novBox">⏰ ماوە بۆ مانگی 11: ... ڕۆژ</div>

        <img 
            src="https://github.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/blob/main/IMG_8805.png?raw=true" 
            alt="هەسارە"
            class="planet-img"
            onerror="this.style.display='none'"
        >
    </div>

    <script>
        const MUSIC_URL = 'https://github.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/blob/main/vidssave.com%20INTERSTELLAR%20%E2%80%93%20Hans%20Zimmer%20-%204k%20720P%202.mp3?raw=true';
        
        // ============ STARS ============
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.cssText = `
                    left: ${Math.random() * 100}%;
                    top: ${Math.random() * 100}%;
                    width: ${size}px;
                    height: ${size}px;
                    animation-delay: ${Math.random() * 2}s;
                `;
                container.appendChild(star);
            }
        }

        // ============ AUTO-PLAY MUSIC ============
        const audio = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        let isPlaying = false;

        function hideLoading() {
            loadingOverlay.classList.add('hidden');
            setTimeout(() => loadingOverlay.remove(), 500);
        }

        function updateMusicButton() {
            if (isPlaying) {
                musicBtn.textContent = '🎵 موزیک ڕاهاتووە';
                musicBtn.classList.add('playing');
            } else {
                musicBtn.textContent = '🎵 دەستپێکردنی موزیک';
                musicBtn.classList.remove('playing');
            }
        }

        function playMusic() {
            audio.src = MUSIC_URL;
            audio.load();
            
            const playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    updateMusicButton();
                    hideLoading();
                }).catch(() => {
                    // Try iframe method
                    tryIframeAutoplay();
                });
            }
        }

        function tryIframeAutoplay() {
            const iframe = document.getElementById('musicFrame');
            iframe.src = `data:text/html,<html><body><script>
                window.onload = function() {
                    var a = new Audio('${MUSIC_URL}');
                    a.loop = true;
                    a.play().then(function() {
                        window.parent.postMessage('music-playing', '*');
                    }).catch(function() {
                        window.parent.postMessage('music-failed', '*');
                    });
                };
            <\/script></body></html>`;
            
            // Fallback: show button to click
            setTimeout(() => {
                if (!isPlaying) {
                    isPlaying = false;
                    updateMusicButton();
                    hideLoading();
                }
            }, 2000);
        }

        // Listen for iframe messages
        window.addEventListener('message', function(e) {
            if (e.data === 'music-playing') {
                isPlaying = true;
                updateMusicButton();
                hideLoading();
                // Sync with main audio
                audio.src = MUSIC_URL;
                audio.load();
                audio.play().catch(() => {});
            } else if (e.data === 'music-failed') {
                isPlaying = false;
                updateMusicButton();
                hideLoading();
            }
        });

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                if (!audio.src) {
                    audio.src = MUSIC_URL;
                    audio.load();
                }
                audio.play().then(() => {
                    isPlaying = true;
                }).catch(() => {
                    isPlaying = false;
                });
            }
            updateMusicButton();
        }

        // Start immediately
        playMusic();

        // Also try on first user interaction
        document.addEventListener('click', function initOnClick() {
            if (!isPlaying) {
                playMusic();
            }
        }, { once: false });

        // ============ COUNTDOWN ============
        const TARGET = new Date(2026, 11, 12, 0, 0, 0);

        function getNextNovember() {
            const now = new Date();
            let nov = new Date(now.getFullYear(), 10, 1);
            if (now > nov) nov = new Date(now.getFullYear() + 1, 10, 1);
            return nov;
        }

        function update() {
            const now = new Date();
            const diff = TARGET - now;

            if (diff <= 0) {
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '0';
                document.getElementById('minutes').textContent = '0';
                document.getElementById('seconds').textContent = '0';
            } else {
                document.getElementById('days').textContent = Math.floor(diff / 86400000);
                document.getElementById('hours').textContent = Math.floor((diff % 86400000) / 3600000);
                document.getElementById('minutes').textContent = Math.floor((diff % 3600000) / 60000);
                document.getElementById('seconds').textContent = Math.floor((diff % 60000) / 1000);
            }

            const novTarget = getNextNovember();
            const novDiff = novTarget - now;
            const novDays = Math.floor(novDiff / 86400000);
            document.getElementById('novBox').textContent = `⏰ ماوە بۆ مانگی 11: ${novDays} ڕۆژ`;
        }

        // ============ INIT ============
        createStars();
        update();
        setInterval(update, 1000);
    </script>
</body>
</html>
