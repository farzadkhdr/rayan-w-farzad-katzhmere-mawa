<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کاتژمێری ماوە</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      background-color: #000;
    }

    /* Background Video Container */
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      z-index: -1;
    }

    /* Start Button Overlay Screen */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      cursor: pointer;
    }

    .start-btn {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 1.1rem;
      color: #fff;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      animation: pulse 2s infinite;
    }

    .start-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(255, 255, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    }

    /* Main Container (Hidden by default) */
    .container {
      text-align: center;
      background: rgba(0, 0, 0, 0.7);
      padding: 18px 20px;
      border-radius: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
      max-width: 85%;
      width: 320px;
      display: none; /* Sharawa ta klik dakre */
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .container.show {
      display: block;
      opacity: 1;
    }

    /* Planet Image Styling */
    .planet-container {
      width: 110px;
      height: 110px;
      margin: 0 auto 12px auto;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .planet-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    /* Countdown Display */
    .countdown-title {
      font-size: 0.95rem;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .timer {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      dir: ltr;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.12);
      padding: 6px 4px;
      border-radius: 8px;
      flex: 1;
    }

    .number {
      font-size: 1.25rem;
      font-weight: bold;
      font-family: Arial, sans-serif;
      display: block;
    }

    .label {
      font-size: 0.7rem;
      opacity: 0.85;
      margin-top: 2px;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video class="video-bg" autoplay loop muted playsinline>
    <source src="https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/From%20Klickpin.com-%20Simple%20public%20policy%20thoughts%20for%20people%20who%20love%20beauty%20for%20busy%20days%20that%20keep%20things%20grounded-pin-id-761108405824554742.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <!-- Audio Element -->
  <audio id="bg-audio" loop preload="auto">
    <source src="https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/vidssave.com%20INTERSTELLAR%20%E2%80%93%20Hans%20Zimmer%20-%204k%20720P%202.mp3" type="audio/mp3">
  </audio>

  <!-- Start Button Screen -->
  <div id="start-overlay">
    <div class="start-btn">داگرە بۆ دەستپێکردن ✦</div>
  </div>

  <!-- Main Card -->
  <div class="container" id="main-card">
    <div class="planet-container">
      <img id="planet" class="planet-img" src="" alt="Planet View">
    </div>

    <div class="countdown-title">کاتی ماوە بۆ 11 / 11 / 2026</div>

    <div class="timer">
      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">ڕۆژ</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">کاتژمێر</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">خولەک</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">چرکە</span>
      </div>
    </div>
  </div>

  <script>
    // Image Slider Configuration
    const images = [
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_0009.jpeg",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_0359.jpeg",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_0482.jpeg",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_4338.png",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_4551.png",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_4648.jpeg",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_5253.jpeg",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_5254.jpeg",
      "https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_7613.jpeg"
    ];

    let currentImgIndex = 0;
    const planetImg = document.getElementById('planet');
    planetImg.src = images[0];

    // High speed image swap (every 200ms)
    setInterval(() => {
      currentImgIndex = (currentImgIndex + 1) % images.length;
      planetImg.src = images[currentImgIndex];
    }, 200);

    // Audio and Screen Reveal Logic
    const audio = document.getElementById('bg-audio');
    const startOverlay = document.getElementById('start-overlay');
    const mainCard = document.getElementById('main-card');

    startOverlay.addEventListener('click', () => {
      // Play Audio
      audio.play().catch(err => console.log("Audio play error:", err));

      // Hide start button overlay
      startOverlay.style.display = 'none';

      // Show Main Card
      mainCard.classList.add('show');
    });

    // Countdown Logic (Target: 11/11/2026)
    const targetDate = new Date('2026-11-11T00:00:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference > 0) {
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById('days').innerText = String(days).padStart(2, '0');
        document.getElementById('hours').innerText = String(hours).padStart(2, '0');
        document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
        document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
      } else {
        document.querySelector('.countdown-title').innerText = "11 / 11 / 2026";
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
