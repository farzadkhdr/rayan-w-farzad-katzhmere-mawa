<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕایان و فەرزاد - Countdown Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a2e, #1a1a4e, #0a0a2e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow-x: hidden;
            position: relative;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
        }

        .title {
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.8);
            animation: glow 2s ease-in-out infinite alternate;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
            }
            to {
                text-shadow: 0 0 30px rgba(138, 43, 226, 1), 0 0 60px rgba(138, 43, 226, 0.5);
            }
        }

        .countdown-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 40px;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            min-width: 150px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .countdown-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .countdown-number {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .countdown-label {
            font-size: 1.2rem;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .countdown-seconds {
            font-size: 1.5rem;
            color: #ffd700;
            margin-top: 10px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.05);
            }
        }

        .logo-container {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            max-width: 200px;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .music-control:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .target-date {
            font-size: 1.2rem;
            margin-top: 30px;
            color: #aaa;
            text-align: center;
        }

        @media (max-width: 768px) {
            .countdown-container {
                gap: 15px;
            }
            
            .countdown-item {
                padding: 20px;
                min-width: 120px;
            }
            
            .countdown-number {
                font-size: 2.5rem;
            }
            
            .title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <button class="music-control" onclick="toggleMusic()" id="musicBtn">
        🎵 پەخشکردن/راوەستاندنی موزیک
    </button>

    <div class="stars" id="stars"></div>

    <div class="container">
        <h1 class="title">ڕایان و فەرزاد</h1>
        
        <div class="countdown-container">
            <div class="countdown-item">
                <div class="countdown-number" id="days">00</div>
                <div class="countdown-label">ڕۆژ</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="hours">00</div>
                <div class="countdown-label">سەعات</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="minutes">00</div>
                <div class="countdown-label">دەقە</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="seconds">00</div>
                <div class="countdown-label">چرکە</div>
            </div>
        </div>

        <div class="countdown-seconds" id="total-seconds">کۆی گشتی: 0 چرکە</div>
        
        <div class="target-date">ماوە تاکو 12/12/2026</div>

        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_8805.png" 
                 alt="Logo" 
                 onerror="this.style.display='none'">
        </div>
    </div>

    <iframe id="youtube-player" 
            style="position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; opacity: 0;" 
            src="https://www.youtube.com/embed/9AXyX555ZoU?autoplay=1&loop=1&playlist=9AXyX555ZoU&controls=0"
            allow="autoplay; encrypted-media" 
            allowfullscreen>
    </iframe>

    <script>
        // Create stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }

        // Create planets
        function createPlanets() {
            const style = document.createElement('style');
            style.textContent = `
                .planet {
                    position: fixed;
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 0;
                    opacity: 0.6;
                }
                
                .earth {
                    position: fixed;
                    width: 80px;
                    height: 80px;
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 0;
                    background: radial-gradient(circle at 30% 30%, #4a90e2, #2e5a88 50%, #1a3a5c);
                    box-shadow: 0 0 30px rgba(74, 144, 226, 0.5);
                    animation: orbit 20s linear infinite;
                    bottom: 10%;
                    right: 10%;
                }
                
                @keyframes orbit {
                    from { transform: rotate(0deg) translateX(50px); }
                    to { transform: rotate(360deg) translateX(50px); }
                }
                
                .planet1 { 
                    width: 40px; height: 40px; 
                    background: radial-gradient(circle at 30% 30%, #ff7b7b, #cc5555);
                    top: 15%; left: 10%;
                    animation: float1 8s ease-in-out infinite;
                }
                .planet2 { 
                    width: 30px; height: 30px; 
                    background: radial-gradient(circle at 30% 30%, #7b9eff, #4a5ecc);
                    top: 20%; right: 15%;
                    animation: float2 10s ease-in-out infinite;
                }
                .planet3 { 
                    width: 50px; height: 50px; 
                    background: radial-gradient(circle at 30% 30%, #ffd700, #cc9900);
                    bottom: 20%; left: 20%;
                    animation: float3 12s ease-in-out infinite;
                }
                .planet4 { 
                    width: 35px; height: 35px; 
                    background: radial-gradient(circle at 30% 30%, #98fb98, #5ecc5e);
                    bottom: 30%; right: 30%;
                    animation: float4 9s ease-in-out infinite;
                }
                
                @keyframes float1 {
                    0%, 100% { transform: translateY(0px); }
                    50% { transform: translateY(-30px); }
                }
                @keyframes float2 {
                    0%, 100% { transform: translateY(0px); }
                    50% { transform: translateY(-20px); }
                }
                @keyframes float3 {
                    0%, 100% { transform: translateY(0px); }
                    50% { transform: translateY(-25px); }
                }
                @keyframes float4 {
                    0%, 100% { transform: translateY(0px); }
                    50% { transform: translateY(-15px); }
                }
            `;
            document.head.appendChild(style);
            
            const planets = document.createElement('div');
            planets.innerHTML = `
                <div class="planet planet1"></div>
                <div class="planet planet2"></div>
                <div class="planet planet3"></div>
                <div class="planet planet4"></div>
                <div class="earth"></div>
            `;
            document.body.appendChild(planets);
        }

        // Countdown logic
        function updateCountdown() {
            const targetDate = new Date('2026-12-12T00:00:00');
            const now = new Date();
            const difference = targetDate - now;
            
            if (difference <= 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.getElementById('total-seconds').textContent = 'کاتی گەیشتنە! 🎉';
                return;
            }
            
            const totalSeconds = Math.floor(difference / 1000);
            const days = Math.floor(totalSeconds / (3600 * 24));
            const hours = Math.floor((totalSeconds % (3600 * 24)) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = Math.floor(totalSeconds % 60);
            
            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            
            document.getElementById('total-seconds').textContent = 
                `کۆی گشتی: ${totalSeconds.toLocaleString()} چرکە`;
        }

        // Music control
        let musicPlaying = true;
        function toggleMusic() {
            const player = document.getElementById('youtube-player');
            if (musicPlaying) {
                player.src = player.src.replace('autoplay=1', 'autoplay=0');
                document.getElementById('musicBtn').textContent = '🎵 دەستپێکردنی موزیک';
            } else {
                player.src = player.src.replace('autoplay=0', 'autoplay=1');
                document.getElementById('musicBtn').textContent = '🎵 پەخشکردن/راوەستاندنی موزیک';
            }
            musicPlaying = !musicPlaying;
        }

        // Initialize
        createStars();
        createPlanets();
        
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
