<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕەیان فەرزاد - کاژمێری مەوا</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Naskh Arabic', 'Segoe UI', Tahoma, sans-serif;
            background: radial-gradient(ellipse at center, #0a0a2e 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            color: #ffffff;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite var(--delay);
            opacity: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            animation: orbit var(--orbit-duration) linear infinite;
        }

        .planet-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            animation: rotate var(--rotate-duration) linear infinite;
        }

        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ffdd00 0%, #ff8c00 40%, #ff4400 70%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 60px #ff6600, 0 0 120px #ff4400, 0 0 200px #ff2200;
            z-index: 3;
            animation: sunPulse 3s ease-in-out infinite;
        }

        @keyframes sunPulse {
            0%, 100% { box-shadow: 0 0 60px #ff6600, 0 0 120px #ff4400, 0 0 200px #ff2200; }
            50% { box-shadow: 0 0 80px #ff8800, 0 0 150px #ff5500, 0 0 250px #ff3300; }
        }

        @keyframes orbit {
            from { transform: rotate(0deg) translateX(var(--orbit-radius)) rotate(0deg); }
            to { transform: rotate(360deg) translateX(var(--orbit-radius)) rotate(-360deg); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .mercury { width: 12px; height: 12px; background: linear-gradient(135deg, #b0b0b0, #696969); top: 50%; left: 50%; }
        .venus { width: 22px; height: 22px; background: linear-gradient(135deg, #e8cda0, #c4934a); top: 50%; left: 50%; }
        .earth { width: 24px; height: 24px; background: linear-gradient(135deg, #4da6ff, #0066cc, #33cc33, #004d00); top: 50%; left: 50%; }
        .mars { width: 16px; height: 16px; background: linear-gradient(135deg, #e84d4d, #8b1a1a); top: 50%; left: 50%; }
        .jupiter { width: 50px; height: 50px; background: linear-gradient(135deg, #d4a574, #b8860b, #cd853f, #8b6914); top: 50%; left: 50%; }
        .saturn { width: 42px; height: 42px; background: linear-gradient(135deg, #f4d03f, #d4a017); top: 50%; left: 50%; position: relative; }
        .saturn-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 15px;
            border: 3px solid rgba(244, 208, 63, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
        }

        .main-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 25px 30px;
            background: rgba(10, 10, 50, 0.5);
            border-radius: 30px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            margin: 20px;
            max-width: 600px;
            width: 90%;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 5px;
            text-shadow: 0 0 30px #ff6600, 0 0 60px #ff4400, 0 0 90px #ff2200;
            color: #ffdd00;
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: #ffaa00;
            text-shadow: 0 0 20px #ff6600;
        }

        .target-date {
            font-size: 1.3rem;
            color: #ccc;
            margin-bottom: 25px;
        }

        .countdown {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }

        .time-block {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 165, 0, 0.5);
            border-radius: 20px;
            padding: 18px 12px;
            min-width: 95px;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .time-block:hover {
            border-color: #ff8800;
            box-shadow: 0 15px 40px rgba(255, 100, 0, 0.5);
            transform: translateY(-5px);
        }

        .time-number {
            font-size: 3.2rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            line-height: 1;
        }

        .time-label {
            font-size: 1.1rem;
            color: #ffaa00;
            margin-top: 8px;
            font-weight: 600;
        }

        .seconds-block {
            background: rgba(255, 68, 0, 0.35);
            border-color: #ff4400;
            box-shadow: 0 0 35px rgba(255, 68, 0, 0.4);
            animation: secondsGlow 1s ease-in-out infinite;
        }

        @keyframes secondsGlow {
            0%, 100% { box-shadow: 0 0 25px rgba(255, 68, 0, 0.3); }
            50% { box-shadow: 0 0 50px rgba(255, 68, 0, 0.7); }
        }

        .footer-image {
            margin-top: 25px;
            border-radius: 15px;
            overflow: hidden;
            max-width: 250px;
            margin-left: auto;
            margin-right: auto;
            border: 3px solid rgba(255, 165, 0, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .footer-image img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }

        .music-control {
            margin-top: 20px;
            background: rgba(255, 100, 0, 0.25);
            border: 2px solid rgba(255, 150, 0, 0.6);
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            color: #ffaa00;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'Noto Naskh Arabic', sans-serif;
        }

        .music-control:hover {
            background: rgba(255, 100, 0, 0.5);
            box-shadow: 0 0 30px rgba(255, 100, 0, 0.6);
            transform: scale(1.05);
        }

        .music-note {
            display: inline-block;
        }

        .playing .music-note {
            animation: bounce 0.6s ease-in-out infinite;
            color: #00ff88;
        }
        .music-note:nth-child(2) { animation-delay: 0.15s; }
        .music-note:nth-child(3) { animation-delay: 0.3s; }

        .paused .music-note {
            animation: none;
            color: #ff6600;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .loading-text {
            color: #ffaa00;
            font-size: 0.9rem;
            margin-top: 8px;
            min-height: 20px;
        }

        @media (max-width: 768px) {
            .title { font-size: 2.2rem; }
            .subtitle { font-size: 1.3rem; }
            .time-number { font-size: 2.2rem; }
            .time-block { min-width: 70px; padding: 15px 10px; }
            .countdown { gap: 10px; }
            .main-container { padding: 20px 15px; }
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <div class="sun"></div>
    <div class="planet mercury" style="--orbit-radius: 90px; --orbit-duration: 2s; --rotate-duration: 10s;">
        <div class="planet-inner mercury"></div>
    </div>
    <div class="planet venus" style="--orbit-radius: 130px; --orbit-duration: 3.5s; --rotate-duration: 15s;">
        <div class="planet-inner venus"></div>
    </div>
    <div class="planet earth" style="--orbit-radius: 170px; --orbit-duration: 5s; --rotate-duration: 20s;">
        <div class="planet-inner earth"></div>
    </div>
    <div class="planet mars" style="--orbit-radius: 210px; --orbit-duration: 7s; --rotate-duration: 25s;">
        <div class="planet-inner mars"></div>
    </div>
    <div class="planet jupiter" style="--orbit-radius: 260px; --orbit-duration: 9s; --rotate-duration: 30s;">
        <div class="planet-inner jupiter"></div>
    </div>
    <div class="planet saturn" style="--orbit-radius: 310px; --orbit-duration: 11s; --rotate-duration: 35s;">
        <div class="saturn-ring"></div>
        <div class="planet-inner saturn"></div>
    </div>

    <div class="main-container">
        <div class="title">ڕەیان فەرزاد</div>
        <div class="subtitle">کاژمێری مەوا</div>
        <div class="target-date">تا 12/12/2026</div>
        
        <div class="countdown">
            <div class="time-block">
                <div class="time-number" id="days">00</div>
                <div class="time-label">ڕۆژ</div>
            </div>
            <div class="time-block">
                <div class="time-number" id="hours">00</div>
                <div class="time-label">سەعات</div>
            </div>
            <div class="time-block">
                <div class="time-number" id="minutes">00</div>
                <div class="time-label">دەقە</div>
            </div>
            <div class="time-block seconds-block">
                <div class="time-number" id="seconds">00</div>
                <div class="time-label">چرکە</div>
            </div>
        </div>

        <div class="footer-image">
            <img src="https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_8805.png" 
                 alt="ڕەیان و فەرزاد"
                 loading="lazy"
                 onerror="this.parentElement.innerHTML='<p style=\'color:#ffaa00;padding:20px;\'>📸 وێنەکە بەردەست نییە</p>';">
        </div>

        <button class="music-control paused" id="musicToggle" onclick="toggleMusic()">
            <span class="music-note">🎵</span>
            <span id="musicStatus">چاوەڕێی مۆسیقا...</span>
            <span class="music-note">🎵</span>
        </button>
        <div class="loading-text" id="loadingText"></div>
    </div>

    <script>
        // ==================== ئەستێرەکان ====================
        (function createStars() {
            const container = document.getElementById('stars');
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < 250; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 3 + 1;
                star.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    left: ${Math.random() * 100}%;
                    top: ${Math.random() * 100}%;
                    --duration: ${Math.random() * 3 + 2}s;
                    --delay: ${Math.random() * 5}s;
                `;
                fragment.appendChild(star);
            }
            container.appendChild(fragment);
        })();

        // ==================== سیستەمی مۆسیقا ====================
        let audioContext = null;
        let gainNode = null;
        let sourceNode = null;
        let audioBuffer = null;
        let isPlaying = false;
        let isLoaded = false;
        let isLoading = false;

        const MUSIC_URL = 'https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/vidssave.com%20INTERSTELLAR%20%E2%80%93%20Hans%20Zimmer%20-%204k%20720P%202.mp3';

        async function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                gainNode = audioContext.createGain();
                gainNode.gain.value = 0.35;
                gainNode.connect(audioContext.destination);
            }
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
        }

        async function loadMusic() {
            if (isLoaded || isLoading) return;
            isLoading = true;
            document.getElementById('loadingText').textContent = '⏳ بارکردنی Interstellar...';

            try {
                await initAudioContext();
                const response = await fetch(MUSIC_URL);
                if (!response.ok) throw new Error('Fetch failed');
                const arrayBuffer = await response.arrayBuffer();
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                isLoaded = true;
                document.getElementById('loadingText').textContent = '✅ ئامادەیە';
                console.log('✅ مۆسیقا بە سەرکەوتوویی بارکرا');
                return true;
            } catch (error) {
                console.error('❌ شکست لە بارکردن:', error);
                document.getElementById('loadingText').textContent = '❌ شکست لە بارکردن';
                return false;
            } finally {
                isLoading = false;
            }
        }

        function playMusic() {
            if (!isLoaded || !audioBuffer || !audioContext || !gainNode) return;
            
            if (sourceNode) {
                try { sourceNode.stop(); } catch(e) {}
            }
            
            sourceNode = audioContext.createBufferSource();
            sourceNode.buffer = audioBuffer;
            sourceNode.loop = true;
            sourceNode.connect(gainNode);
            sourceNode.start(0);
            isPlaying = true;
            updateUI();
        }

        function pauseMusic() {
            if (sourceNode) {
                try { sourceNode.stop(); } catch(e) {}
                sourceNode = null;
            }
            isPlaying = false;
            updateUI();
        }

        function resumeMusic() {
            if (!isLoaded || !audioBuffer || !audioContext || !gainNode) return;
            
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            if (sourceNode) {
                try { sourceNode.stop(); } catch(e) {}
            }
            
            sourceNode = audioContext.createBufferSource();
            sourceNode.buffer = audioBuffer;
            sourceNode.loop = true;
            sourceNode.connect(gainNode);
            sourceNode.start(0);
            isPlaying = true;
            updateUI();
        }

        function stopMusic() {
            if (sourceNode) {
                try { sourceNode.stop(); } catch(e) {}
                sourceNode = null;
            }
            isPlaying = false;
            isLoaded = false;
            audioBuffer = null;
            updateUI();
        }

        async function toggleMusic() {
            if (isLoading) return;

            if (!isLoaded) {
                const loaded = await loadMusic();
                if (loaded) {
                    playMusic();
                }
            } else {
                if (isPlaying) {
                    pauseMusic();
                } else {
                    resumeMusic();
                }
            }
        }

        function updateUI() {
            const statusText = document.getElementById('musicStatus');
            const toggleBtn = document.getElementById('musicToggle');
            
            if (isLoading) {
                statusText.textContent = 'بارکردن...';
                toggleBtn.classList.add('paused');
                toggleBtn.classList.remove('playing');
            } else if (!isLoaded) {
                statusText.textContent = 'کرتە بکە بۆ مۆسیقا 🎵';
                toggleBtn.classList.add('paused');
                toggleBtn.classList.remove('playing');
            } else if (isPlaying) {
                statusText.textContent = 'مۆسیقا ڕاگرتن ⏸️';
                toggleBtn.classList.add('playing');
                toggleBtn.classList.remove('paused');
            } else {
                statusText.textContent = 'مۆسیقا لێدان ▶️';
                toggleBtn.classList.add('paused');
                toggleBtn.classList.remove('playing');
            }
        }

        // ==================== ئۆتۆپلەی خۆکارانە ====================
        async function autoPlay() {
            const loaded = await loadMusic();
            if (loaded) {
                playMusic();
            }
        }

        // هەوڵی ئۆتۆپلە
        setTimeout(autoPlay, 1000);

        // ==================== کاژمێری مەوا ====================
        const targetDate = new Date('2026-12-12T00:00:00');

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.querySelector('.subtitle').textContent = 'گەیشتین! 🎉';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // ==================== پاککردنەوە ====================
        window.addEventListener('beforeunload', () => {
            stopMusic();
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
        });

        // ==================== کۆنترۆڵی کیبۆرد ====================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleMusic();
            }
        });

        updateUI();
        console.log('🌟 ڕەیان فەرزاد - کاژمێری مەوا');
        console.log('📅 تا 12/12/2026');
        console.log('🎵 Interstellar - Hans Zimmer');
        console.log('🖱️ کلیک بکە یان Space بپەستە بۆ کۆنترۆڵی مۆسیقا');
    </script>
</body>
</html>
