<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕەیان فەرزاد - کاژمێری مەوا</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Naskh Arabic', 'Segoe UI', Tahoma, sans-serif;
            background: radial-gradient(ellipse at center, #0a0a2e 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            color: #ffffff;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite var(--delay);
            opacity: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            animation: orbit var(--orbit-duration) linear infinite;
        }

        .planet-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            animation: rotate var(--rotate-duration) linear infinite;
        }

        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ffdd00 0%, #ff8c00 40%, #ff4400 70%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 60px #ff6600, 0 0 120px #ff4400, 0 0 200px #ff2200;
            z-index: 3;
            animation: sunPulse 3s ease-in-out infinite;
        }

        @keyframes sunPulse {
            0%, 100% { box-shadow: 0 0 60px #ff6600, 0 0 120px #ff4400, 0 0 200px #ff2200; }
            50% { box-shadow: 0 0 80px #ff8800, 0 0 150px #ff5500, 0 0 250px #ff3300; }
        }

        @keyframes orbit {
            from { transform: rotate(0deg) translateX(var(--orbit-radius)) rotate(0deg); }
            to { transform: rotate(360deg) translateX(var(--orbit-radius)) rotate(-360deg); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .mercury {
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #b0b0b0, #696969);
            top: 50%;
            left: 50%;
        }
        .venus {
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #e8cda0, #c4934a);
            top: 50%;
            left: 50%;
        }
        .earth {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #4da6ff, #0066cc, #33cc33, #004d00);
            top: 50%;
            left: 50%;
        }
        .mars {
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #e84d4d, #8b1a1a);
            top: 50%;
            left: 50%;
        }
        .jupiter {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #d4a574, #b8860b, #cd853f, #8b6914);
            top: 50%;
            left: 50%;
        }
        .saturn {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #f4d03f, #d4a017);
            top: 50%;
            left: 50%;
            position: relative;
        }
        .saturn-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 15px;
            border: 3px solid rgba(244, 208, 63, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
        }

        .main-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            background: rgba(10, 10, 50, 0.4);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            margin: 20px;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 0 30px #ff6600, 0 0 60px #ff4400, 0 0 90px #ff2200;
            color: #ffdd00;
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: #ffaa00;
            text-shadow: 0 0 20px #ff6600;
        }

        .target-date {
            font-size: 1.4rem;
            color: #ccc;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .countdown {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .time-block {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 165, 0, 0.5);
            border-radius: 20px;
            padding: 20px 15px;
            min-width: 100px;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .time-block:hover {
            border-color: #ff8800;
            box-shadow: 0 15px 40px rgba(255, 100, 0, 0.4);
            transform: translateY(-5px);
        }

        .time-number {
            font-size: 3.5rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            line-height: 1;
        }

        .time-label {
            font-size: 1.1rem;
            color: #ffaa00;
            margin-top: 8px;
            font-weight: 600;
        }

        .seconds-block {
            background: rgba(255, 68, 0, 0.3);
            border-color: #ff4400;
            box-shadow: 0 0 30px rgba(255, 68, 0, 0.3);
        }

        .footer-image {
            margin-top: 30px;
            border-radius: 15px;
            overflow: hidden;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            border: 3px solid rgba(255, 165, 0, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .footer-image img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }

        .music-control {
            margin-top: 20px;
            background: rgba(255, 100, 0, 0.2);
            border: 1px solid rgba(255, 150, 0, 0.5);
            padding: 10px 25px;
            border-radius: 50px;
            cursor: pointer;
            color: #ffaa00;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'Noto Naskh Arabic', sans-serif;
        }

        .music-control:hover {
            background: rgba(255, 100, 0, 0.4);
            box-shadow: 0 0 25px rgba(255, 100, 0, 0.5);
        }

        .music-note {
            display: inline-block;
            animation: bounce 0.6s ease-in-out infinite;
        }
        .music-note:nth-child(2) { animation-delay: 0.15s; }
        .music-note:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .playing .music-note {
            animation-play-state: running;
            color: #00ff88;
        }
        .paused .music-note {
            animation-play-state: paused;
            color: #ff6600;
        }

        .loading-indicator {
            color: #ffaa00;
            font-size: 0.9rem;
            margin-top: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .volume-slider {
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .volume-slider input {
            width: 100px;
            accent-color: #ffaa00;
            cursor: pointer;
        }

        .volume-label {
            color: #ffaa00;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .title { font-size: 2.2rem; }
            .subtitle { font-size: 1.3rem; }
            .time-number { font-size: 2.2rem; }
            .time-block { min-width: 70px; padding: 15px 10px; }
            .countdown { gap: 10px; }
            .sun { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <div class="sun"></div>
    <div class="planet mercury" style="--orbit-radius: 90px; --orbit-duration: 2s; --rotate-duration: 10s; --delay: 0s;">
        <div class="planet-inner mercury"></div>
    </div>
    <div class="planet venus" style="--orbit-radius: 130px; --orbit-duration: 3.5s; --rotate-duration: 15s; --delay: 0s;">
        <div class="planet-inner venus"></div>
    </div>
    <div class="planet earth" style="--orbit-radius: 170px; --orbit-duration: 5s; --rotate-duration: 20s; --delay: 0s;">
        <div class="planet-inner earth"></div>
    </div>
    <div class="planet mars" style="--orbit-radius: 210px; --orbit-duration: 7s; --rotate-duration: 25s; --delay: 0s;">
        <div class="planet-inner mars"></div>
    </div>
    <div class="planet jupiter" style="--orbit-radius: 260px; --orbit-duration: 9s; --rotate-duration: 30s; --delay: 0s;">
        <div class="planet-inner jupiter"></div>
    </div>
    <div class="planet saturn" style="--orbit-radius: 310px; --orbit-duration: 11s; --rotate-duration: 35s; --delay: 0s;">
        <div class="saturn-ring"></div>
        <div class="planet-inner saturn"></div>
    </div>

    <div class="main-container">
        <div class="title">ڕەیان فەرزاد</div>
        <div class="subtitle">کاژمێری مەوا</div>
        <div class="target-date">تا 12/12/2026</div>
        
        <div class="countdown" id="countdown">
            <div class="time-block">
                <div class="time-number" id="days">00</div>
                <div class="time-label">ڕۆژ</div>
            </div>
            <div class="time-block">
                <div class="time-number" id="hours">00</div>
                <div class="time-label">سەعات</div>
            </div>
            <div class="time-block">
                <div class="time-number" id="minutes">00</div>
                <div class="time-label">دەقە</div>
            </div>
            <div class="time-block seconds-block">
                <div class="time-number" id="seconds">00</div>
                <div class="time-label">چرکە</div>
            </div>
        </div>

        <div class="footer-image">
            <img src="https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/IMG_8805.png" 
                 alt="ڕەیان و فەرزاد" 
                 onerror="this.style.display='none'; this.parentElement.innerHTML='<p style=\'color:#ffaa00; padding:20px;\'>وێنەکە بەردەست نییە</p>';">
        </div>

        <button class="music-control" id="musicToggle" onclick="toggleMusic()">
            <span class="music-note">🎵</span>
            <span id="musicStatus">مۆسیقا ڕاگرتن</span>
            <span class="music-note">🎵</span>
        </button>
        
        <div class="loading-indicator" id="loadingIndicator" style="display: none;">⏳ بارکردنی مۆسیقای Interstellar...</div>

        <div class="volume-slider">
            <span class="volume-label">🔊</span>
            <input type="range" id="volumeControl" min="0" max="100" value="40" onchange="changeVolume(this.value)">
            <span class="volume-label" id="volumePercent">40%</span>
        </div>
    </div>

    <!-- Audio Element بۆ مۆسیقای Interstellar -->
    <audio id="bgMusic" preload="auto" style="display: none;"></audio>

    <script>
        // ==========================================
        // دروستکردنی ئەستێرەکان
        // ==========================================
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 250;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.setProperty('--delay', (Math.random() * 5) + 's');
                starsContainer.appendChild(star);
            }
        }
        createStars();

        // ==========================================
        // سیستەمی مۆسیقای خۆکارانە - Interstellar
        // ==========================================
        const audioElement = document.getElementById('bgMusic');
        let isPlaying = false;
        let musicStarted = false;
        let isLoading = false;

        // لینکی ڕاستەوخۆی مۆسیقای Interstellar لە GitHub
        const MUSIC_URL = 'https://raw.githubusercontent.com/farzadkhdr/rayan-w-farzad-katzhmere-mawa/main/vidssave.com%20INTERSTELLAR%20%E2%80%93%20Hans%20Zimmer%20-%204k%20720P%202.mp3';

        // فەنکشنی دەستپێکردنی مۆسیقا
        async function startMusic() {
            if (isLoading || musicStarted) return;
            isLoading = true;
            
            const loadingEl = document.getElementById('loadingIndicator');
            if (loadingEl) loadingEl.style.display = 'block';

            try {
                // ڕێکخستنی audio element
                audioElement.src = MUSIC_URL;
                audioElement.loop = true;
                audioElement.volume = 0.4;
                
                // هەوڵدان بۆ لێدانی مۆسیقا
                await audioElement.play();
                
                isPlaying = true;
                musicStarted = true;
                updateMusicButton();
                console.log('✅ مۆسیقای Interstellar بە سەرکەوتوویی دەستی پێکرد');
            } catch (error) {
                console.warn('⚠️ ئۆتۆپلەی ڕێگەپێنەدرا:', error.message);
                console.log('🖱️ چاوەڕێی یەکەم کلیکی بەکارهێنەر...');
                
                // ئامادەکردنی مۆسیقا بۆ لێدان
                audioElement.src = MUSIC_URL;
                audioElement.loop = true;
                audioElement.volume = 0.4;
                audioElement.load();
                
                document.getElementById('musicStatus').textContent = 'کرتەیەک بکە 🎵';
            } finally {
                isLoading = false;
                if (loadingEl) loadingEl.style.display = 'none';
            }
        }

        function stopMusic() {
            audioElement.pause();
            audioElement.currentTime = 0;
            isPlaying = false;
            musicStarted = false;
            updateMusicButton();
        }

        function toggleMusic() {
            if (isLoading) return;
            
            if (!musicStarted) {
                // یەکەم جار - دەستپێکردنی مۆسیقا
                audioElement.src = MUSIC_URL;
                audioElement.loop = true;
                audioElement.volume = document.getElementById('volumeControl').value / 100;
                
                audioElement.play().then(() => {
                    isPlaying = true;
                    musicStarted = true;
                    updateMusicButton();
                    console.log('✅ مۆسیقا دەستی پێکرد');
                }).catch(error => {
                    console.error('❌ شکست لە لێدانی مۆسیقا:', error);
                    document.getElementById('musicStatus').textContent = 'دووبارە کرتە بکە';
                });
            } else {
                // ڕاگرتن یان لێدان
                if (isPlaying) {
                    audioElement.pause();
                    isPlaying = false;
                } else {
                    audioElement.play().then(() => {
                        isPlaying = true;
                    }).catch(error => {
                        console.error('❌ شکست لە لێدان:', error);
                    });
                }
                updateMusicButton();
            }
        }

        function changeVolume(value) {
            const volume = value / 100;
            audioElement.volume = volume;
            document.getElementById('volumePercent').textContent = value + '%';
        }

        function updateMusicButton() {
            const statusText = document.getElementById('musicStatus');
            const musicControl = document.getElementById('musicToggle');
            
            if (!musicStarted) {
                statusText.textContent = 'کرتە بکە بۆ مۆسیقا';
                musicControl.classList.remove('playing');
                musicControl.classList.add('paused');
            } else if (isPlaying) {
                statusText.textContent = 'مۆسیقا ڕاگرتن';
                musicControl.classList.add('playing');
                musicControl.classList.remove('paused');
            } else {
                statusText.textContent = 'مۆسیقا لێدان';
                musicControl.classList.add('paused');
                musicControl.classList.remove('playing');
            }
        }

        // ==========================================
        // کاژمێری مەوا - Countdown Timer
        // ==========================================
        const targetDate = new Date('2026-12-12T00:00:00');

        function updateCountdown() {
            const now = new Date();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.querySelector('.subtitle').textContent = 'گەیشتین! 🎉';
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // ==========================================
        // ئۆتۆپلەی خۆکارانە - هەوڵی زیرەکانە
        // ==========================================
        async function autoPlayMusic() {
            try {
                await startMusic();
            } catch (e) {
                console.log('چاوەڕێی کارلێکی بەکارهێنەر بۆ مۆسیقا...');
                
                const autoPlayOnInteraction = async () => {
                    if (!musicStarted && !isLoading) {
                        audioElement.src = MUSIC_URL;
                        audioElement.loop = true;
                        audioElement.volume = 0.4;
                        
                        try {
                            await audioElement.play();
                            isPlaying = true;
                            musicStarted = true;
                            updateMusicButton();
                            console.log('✅ مۆسیقا بە کلیک دەستی پێکرد');
                        } catch (err) {
                            console.error('❌ هێشتا شکست:', err);
                        }
                        
                        document.removeEventListener('click', autoPlayOnInteraction);
                        document.removeEventListener('keydown', autoPlayOnInteraction);
                        document.removeEventListener('touchstart', autoPlayOnInteraction);
                    }
                };
                
                document.addEventListener('click', autoPlayOnInteraction, { once: true });
                document.addEventListener('keydown', autoPlayOnInteraction, { once: true });
                document.addEventListener('touchstart', autoPlayOnInteraction, { once: true });
            }
        }

        // دەستپێکردنی ئۆتۆپلەی دوای 800ms
        setTimeout(autoPlayMusic, 800);

        // پاککردنەوە لە کاتی داخستن
        window.addEventListener('beforeunload', () => {
            stopMusic();
        });

        console.log('🌟 ڕەیان فەرزاد - کاژمێری مەوا ئامادەیە');
        console.log('📅 تا 12/12/2026');
        console.log('🎵 Interstellar - Hans Zimmer');
    </script>
</body>
</html>
